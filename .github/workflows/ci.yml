name: ParcelFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: parcelflow-backend:ci
          cache-from: type=gha,scope=parcelflow-backend
          cache-to: type=gha,scope=parcelflow-backend,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: parcelflow-frontend:ci
          cache-from: type=gha,scope=parcelflow-frontend
          cache-to: type=gha,scope=parcelflow-frontend,mode=max


  backend-build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Test and build Spring Boot
        run: mvn -B verify

  frontend-build:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

  publish-images:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    needs:
      - docker-build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image namespace
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/parcelflow-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/parcelflow-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=parcelflow-backend
          cache-to: type=gha,scope=parcelflow-backend,mode=max

      - name: Publish frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/parcelflow-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/parcelflow-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=parcelflow-frontend
          cache-to: type=gha,scope=parcelflow-frontend,mode=max
