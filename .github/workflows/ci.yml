name: ParcelFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend with Maven
        run: mvn -B -DskipTests package