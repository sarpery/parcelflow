spring.application.name=parcelflow

spring.datasource.url=jdbc:postgresql://localhost:5432/parcelflow
spring.datasource.username=parcelflow
spring.datasource.password=parcelflow

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000